services:

  app-1:
    image: sunjaegood/high-concurrency-ticketing-api:dev
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    depends_on:
      - mysql
      - redis

  app-2:
    image: sunjaegood/high-concurrency-ticketing-api:dev
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    depends_on:
      - app-1
      - app-2
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ticketing}
    ports:
      - "3306:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mysql-data:
